<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ParkWise</title>
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main id="page" hidden>
  <div class="page-head" id="head"></div>
  <section class="card" id="body"></section>
</main>
<script type="module">
  // Phase 1 placeholder: login + layout work. Data cards come when the dashboard API is ready.
  import { mountShell, pageHeader } from "/js/shell.js";
  import { html, icon, render, $, emptyState } from "/js/ui.js";

  const user = await mountShell({ role: "Staff", active: "dashboard" });
  pageHeader($("#head"), {
    title: "Today at the lot",
    subtitle: "Check vehicles in and out and keep an eye on bay status.",
    actions: html`<a class="btn btn-primary" href="/staff/search.html">${icon("search")} Find a booking</a>`,
  });
  render($("#body"), emptyState({ iconName: "layout-grid", title: "This page is under construction",
    text: "Sign-in and permissions are working. Overview data will appear once this page's API is ready." }));
</script>
</body>
</html>
