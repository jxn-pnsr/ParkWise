<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bay status – ParkWise</title>
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main id="page" hidden>
  <div class="page-head" id="head"></div>
  <section class="panel">
    <div class="panel-head">
      <div class="segmented" id="lots" role="tablist" aria-label="Parking lot" style="min-width:240px"></div>
      <button type="button" class="btn btn-outline" id="refresh"></button>
    </div>
    <p class="muted small" id="summary" style="margin:-4px 0 12px"></p>
    <div id="map"></div>
  </section>
  <section class="panel mt-3">
    <div class="panel-head"><h2>Every bay</h2></div>
    <div class="slot-list" id="list"></div>
  </section>
</main>
<script type="module">
  import { api } from "/js/api.js";
  import { mountShell, pageHeader } from "/js/shell.js";
  import { html, icon, render, $, $$, toastError } from "/js/ui.js";
  import { fmtTime } from "/js/format.js";
  import { renderBayMap, mapSkeleton, BAY_NOTE } from "/js/baymap.js";

  await mountShell({ role: "Staff", active: "slots" });
  pageHeader($("#head"), { title: "Bay status", subtitle: "Live colours for every bay right now. Plates are shown for parked and booked bays." });
  render($("#refresh"), html`${icon("refresh-cw", "icon icon-sm")} Refresh`);

  const lots = (await api.get("/lots").catch((e) => { toastError(e); return { items: [] }; })).items;
  let lotId = lots[0]?.lot_id;
  render($("#lots"), lots.map((l, i) => html`<button type="button" data-lot="${l.lot_id}" aria-pressed="${i === 0}">${l.lot_name}</button>`));
  $$("[data-lot]").forEach((b) => b.onclick = () => {
    lotId = Number(b.dataset.lot);
    $$("[data-lot]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    load();
  });

  const CLS = { Available: "s-available", Occupied: "s-occupied", Reserved: "s-reserved", Held: "s-held", Maintenance: "s-maintenance" };

  async function load() {
    if (!lotId) return;
    mapSkeleton($("#map"));
    let d;
    try { d = await api.get(`/lots/${lotId}/slots`); } catch (err) { toastError(err); return; }
    const c = d.counts;
    $("#summary").textContent = `${d.lot.lot_name} · ${c.Available} available · ${c.Occupied} occupied · ${c.Reserved} reserved · ${c.Held} on hold · ${c.Maintenance} closed`;
    renderBayMap($("#map"), { slots: d.slots, lotName: d.lot.lot_name, showPlates: true });
    render($("#list"), d.slots.map((s) => html`<div class="slot-chip ${CLS[s.display_status]}">
      <b>${s.slot_code}</b><small>${s.plate_number || (s.slot_type === "EV" ? "EV charging" : "Standard")}</small>
      <span class="right">${BAY_NOTE[s.display_status]}${s.busy_until && s.display_status !== "Maintenance" ? ` · until ${fmtTime(s.busy_until)}` : ""}${s.overstay ? " · late" : ""}</span></div>`));
  }
  $("#refresh").onclick = load;
  load();
  setInterval(load, 60000);
</script>
</body>
</html>
