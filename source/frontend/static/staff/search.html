<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find a booking – ParkWise</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main id="page" hidden>
  <div class="page-head" id="head"></div>
  <section class="panel">
    <form class="big-search" id="search" role="search" novalidate>
      <div class="input-icon">
        <svg class="icon"><use href="/vendor/icons/sprite.svg#search"/></svg>
        <input class="input" id="plate" name="plate" placeholder="Licence plate, e.g. 1AB 1234" autocomplete="off" aria-label="Licence plate" autofocus>
      </div>
      <button class="btn btn-primary btn-rect" type="submit">Search</button>
    </form>
    <p class="hint mt-1">Every customer books online first. There are no walk-ins, and staff cannot create bookings.</p>
  </section>
  <div id="results" class="mt-3"></div>
</main>
<script type="module">
  import { api } from "/js/api.js";
  import { mountShell, pageHeader } from "/js/shell.js";
  import { html, icon, render, $, toastError, emptyState, reservationBadge, getParam } from "/js/ui.js";
  import { fmtRange, fmtMoney } from "/js/format.js";
  import { reservationCard, wireActions } from "/js/staff.js";

  await mountShell({ role: "Staff", active: "search" });
  pageHeader($("#head"), { title: "Find a booking", subtitle: "Type the licence plate of the car at the gate." });

  let last = null;
  async function search(plate) {
    if ((plate || "").replace(/\s/g, "").length < 2) { $("#plate").focus(); return; }
    history.replaceState(null, "", "?plate=" + encodeURIComponent(plate));
    render($("#results"), html`<div class="skeleton" style="height:180px;border-radius:16px"></div>`);
    try { last = await api.get("/staff/search", { plate }); }
    catch (err) { toastError(err); render($("#results"), ""); return; }
    const list = [...last.active, ...last.recent];
    const find = (id) => list.find((r) => String(r.reservation_id) === String(id));
    render($("#results"), html`
      ${last.active.length ? html`<div class="result-grid">${last.active.map(reservationCard)}</div>`
        : html`<section class="panel">${emptyState({ iconName: "search", title: `No active booking for “${plate}”`,
            text: "Ask the driver to book a bay in the ParkWise app first. Recent bookings for this plate are listed below." })}</section>`}
      ${last.recent.length ? html`<section class="panel mt-3"><div class="panel-head"><h2>Recent bookings for this plate</h2></div>
        <div class="table-wrap"><table class="table"><thead><tr><th>Plate</th><th>Bay</th><th>Booked</th><th>Status</th><th>Payment</th></tr></thead>
        <tbody>${last.recent.map((r) => html`<tr><td><b>${r.vehicle.plate_number}</b></td><td>${r.slot.slot_code} · ${r.slot.lot_name}</td>
          <td>${fmtRange(r.start_time, r.end_time)}</td><td>${reservationBadge(r.status, r.display_label)}</td>
          <td>${r.payment ? (r.payment.status === "Paid" ? html`<span class="subtle">Paid</span>`
            : html`<button class="btn btn-secondary btn-sm" data-cash="${r.reservation_id}">Cash received (${fmtMoney(r.payment.total_amount, 2)})</button>`) : html`<span class="subtle">–</span>`}</td></tr>`)}</tbody></table></div></section>` : ""}`);
    wireActions($("#results"), find, () => search(plate));
  }

  $("#search").onsubmit = (e) => { e.preventDefault(); search($("#plate").value.trim()); };
  if (getParam("plate")) { $("#plate").value = getParam("plate"); search(getParam("plate")); }
</script>
</body>
</html>
