<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preferences – ParkWise</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main id="page" hidden>
  <div class="page-head" id="head"></div>
  <div class="dash-grid" style="grid-template-columns:1fr 1fr">
    <section class="panel" aria-labelledby="look-title">
      <div class="panel-head"><h2 id="look-title">Booking</h2></div>
      <div class="res-form">
        <div class="field"><label class="label" for="vehicle">Main vehicle (chosen first when you book)</label>
          <select class="select" id="vehicle"></select></div>
      </div>
    </section>
    <section class="panel" aria-labelledby="n-title">
      <div class="panel-head"><h2 id="n-title">Notifications</h2></div>
      <div id="switches"></div>
      <button type="button" class="btn btn-secondary btn-block mt-2" id="reset">Reset to defaults</button>
    </section>
  </div>
</main>
<script type="module">
  // User_Preferences lives in MongoDB and is changed directly by Flask (spec 10.3).
  // The main vehicle is stored in MySQL (Customer_Vehicles.is_default), the source of truth.
  import { api } from "/js/api.js";
  import { mountShell, pageHeader } from "/js/shell.js";
  import { html, render, $, $$, toast, toastError, confirmDialog } from "/js/ui.js";
  import { fmtPlate } from "/js/format.js";

  await mountShell({ role: "Customer", active: "preferences" });
  pageHeader($("#head"), { title: "Preferences", subtitle: "Choose your main vehicle and which messages you receive. Changes save straight away." });

  const LABELS = {
    holdExpired: ["Hold expired", "When a held bay is released because you did not confirm in time"],
    noShow: ["No-show", "When a booking is cancelled because you did not arrive"],
    checkIn: ["Checked in", "When staff check your car in"],
    checkOut: ["Checked out", "When you leave and the fee is ready"],
    overstay: ["Time running out", "15 minutes before your time ends, and if you stay longer"],
  };

  let prefs, vehicles = [];

  function draw() {
    render($("#vehicle"), vehicles.length ? vehicles.map((v) => html`<option value="${v.vehicle_id}" ${v.vehicle_id === prefs.defaultVehicleId ? "selected" : ""}>${fmtPlate(v)}</option>`)
      : html`<option value="">Add a vehicle first</option>`);
    render($("#switches"), Object.entries(LABELS).map(([key, [title, text]]) => html`<div class="switch-row">
      <div><b>${title}</b><small>${text}</small></div>
      <label class="switch"><input type="checkbox" data-n="${key}" ${prefs.notifications[key] ? "checked" : ""} aria-label="${title}"><span></span></label></div>`));
    $$("[data-n]").forEach((c) => c.onchange = () => save({ notifications: { [c.dataset.n]: c.checked } }, `${LABELS[c.dataset.n][0]}: ${c.checked ? "on" : "off"}`));
  }

  async function save(change, message = "Saved.") {
    try {
      prefs = await api.put("/me/preferences", change);
      draw();
      toast(message);
    } catch (err) { toastError(err); draw(); }
  }

  try {
    [prefs, vehicles] = await Promise.all([api.get("/me/preferences"), api.get("/me/vehicles")]);
    draw();
  } catch (err) { toastError(err); }

  $("#vehicle").onchange = (e) => e.target.value && save({ defaultVehicleId: Number(e.target.value) }, "Main vehicle updated.");
  $("#reset").onclick = async () => {
    if (!(await confirmDialog({ title: "Reset your preferences?", message: "Main vehicle and notification switches go back to the defaults." }))) return;
    try { prefs = await api.del("/me/preferences"); draw(); toast("Preferences reset."); } catch (err) { toastError(err); }
  };
</script>
</body>
</html>
